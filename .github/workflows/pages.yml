name: Deploy frozen Port Solano showcase

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: port-solano-frozen-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download the frozen public source
        run: |
          mkdir source
          curl --fail --silent --show-error --location https://api.github.com/repos/KSHR-AI/gta-v-opus-v-v/tarball/d49675b1dac0c2b784f98f8cd740a7743ad30d11 | tar -xz --strip-components=1 -C source
      - name: Build without host credentials
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/source:/game" -w /game node:24.19.0-bookworm-slim \
            sh -c 'npm ci --ignore-scripts && npm run build -- --base=./ && touch dist/.nojekyll'
      - name: Upload static files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: source/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
